[package]
name = "wl_traton"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.77"
description = "Versioned Windows object paths and native translation contracts for WinLook"
license = "MIT"
readme = "README.md"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
