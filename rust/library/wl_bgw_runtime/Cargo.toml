[package]
name = "wl_bgw_runtime"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.77"
description = "Initial WinLook BGW runtime host loop"
license = "MIT"
readme = "README.md"

[dependencies]
wl_wlde = { version = "0.1.0-alpha.1", path = "../wl_wlde" }
wl_wlde_win32 = { version = "0.1.0-alpha.1", path = "../wl_wlde_win32" }
wl_traton = { version = "0.1.0-alpha.1", path = "../wl_traton" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
