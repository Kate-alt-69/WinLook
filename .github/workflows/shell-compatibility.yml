name: Build runner shell compatibility

on:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "tests/test_build.py"
      - ".github/workflows/shell-compatibility.yml"
  pull_request:
    branches: [main]
    paths:
      - "build.py"
      - "tests/test_build.py"
      - ".github/workflows/shell-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-entry:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Run CLI from Windows PowerShell 5.1
        run: python build.py --help
        shell: powershell
      - name: Test batch invocation from Windows PowerShell 5.1
        run: python -m unittest discover -s tests -p test_build.py -k windows_batch_environment -v
        shell: powershell

      - name: Run CLI from PowerShell 7
        run: python build.py --help
        shell: pwsh
      - name: Test batch invocation from PowerShell 7
        run: python -m unittest discover -s tests -p test_build.py -k windows_batch_environment -v
        shell: pwsh

      - name: Run CLI from CMD
        run: python build.py --help
        shell: cmd
      - name: Test batch invocation from CMD
        run: python -m unittest discover -s tests -p test_build.py -k windows_batch_environment -v
        shell: cmd

      - name: Run CLI from Git Bash
        run: python build.py --help
        shell: bash
      - name: Test batch invocation from Git Bash
        run: python -m unittest discover -s tests -p test_build.py -k windows_batch_environment -v
        shell: bash
