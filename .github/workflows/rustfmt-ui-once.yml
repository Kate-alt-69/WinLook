name: Format Manager UI Rust sources (one-time migration helper)

on:
  push:
    branches: [feature/wintoys-manager-ui]

permissions:
  contents: write

jobs:
  format:
    if: github.ref_name == 'feature/wintoys-manager-ui'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate the application dependency lockfile
        run: cargo generate-lockfile
      - name: Format the Rust workspace
        run: cargo fmt --all
      - name: Commit formatting changes
        shell: pwsh
        run: |
          if (git diff --quiet) {
            Write-Host "Rust sources are already formatted."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock rust/library/wl_ui rust/win10 rust/win11
          git commit -m "style: format native Manager UI"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
