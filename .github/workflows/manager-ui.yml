name: Manager UI verification

on:
  push:
    branches: [main, github/workflow]
    paths:
      - "rust/library/wl_ui/**"
      - "rust/library/wl_ui_core/**"
      - "rust/library/wl_ui_win32/**"
      - "rust/library/wl_ui_windows7/**"
      - "rust/library/wl_ui_windows10/**"
      - "rust/library/wl_ui_windows11/**"
      - "rust/adapters/wl_ui_tauri2/**"
      - "rust/win10/**"
      - "rust/win11/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.py"
      - ".github/workflows/manager-ui.yml"
  pull_request:
    branches: [main, feature/wintoys-manager-ui]
    paths:
      - "rust/library/wl_ui/**"
      - "rust/library/wl_ui_core/**"
      - "rust/library/wl_ui_win32/**"
      - "rust/library/wl_ui_windows10/**"
      - "rust/win10/**"
      - "rust/win11/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Manager UI source
    runs-on: windows-2022
    outputs:
      available: ${{ steps.target.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - id: target
        name: Check that all UI manifests exist
        run: python build.py status ui --github-output

  verify:
    name: wl_ui facade / Windows 10 Win32 tests
    needs: detect
    if: needs.detect.outputs.available == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Select or install Rust 1.95.0 without changing the default
        run: python build.py setup --with-rust --apply
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/.rcache
            build/rust/shared
          key: ${{ runner.os }}-manager-ui-${{ hashFiles('Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-manager-ui-
      - name: Verify Manager UI
        run: python build.py verify ui
      - name: Export resolved Cargo lockfile for reproducibility
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("Cargo.lock")
          $encoded = [Convert]::ToBase64String($bytes)
          Write-Output "WINLOOK_CARGO_LOCK_BEGIN"
          for ($offset = 0; $offset -lt $encoded.Length; $offset += 2000) {
            $length = [Math]::Min(2000, $encoded.Length - $offset)
            $index = [int]($offset / 2000)
            $chunk = $encoded.Substring($offset, $length)
            Write-Output ("WINLOOK_CARGO_LOCK_{0:D4}={1}" -f $index, $chunk)
          }
          Write-Output "WINLOOK_CARGO_LOCK_END"
