
name: Manager UI verification

on:
  push:
    branches: [main, github/workflow]
    paths:
      - "rust/library/wl_ui/**"
      - "rust/win10/**"
      - "rust/win11/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.py"
      - ".github/workflows/manager-ui.yml"
  pull_request:
    branches: [main, feature/wintoys-manager-ui]
    paths:
      - "rust/library/wl_ui/**"
      - "rust/win10/**"
      - "rust/win11/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Manager UI source
    runs-on: windows-2022
    outputs:
      available: ${{ steps.target.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - id: target
        name: Check that all UI manifests exist
        run: python build.py status ui --github-output

  verify:
    name: WinUI 3 / Manager tests and lint
    needs: detect
    if: needs.detect.outputs.available == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/.rcache
            build/rust/shared
          key: ${{ runner.os }}-manager-ui-${{ hashFiles('Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-manager-ui-
      - name: Verify Manager UI
        run: python build.py verify ui
