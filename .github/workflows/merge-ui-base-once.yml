name: Rebase Manager UI branch on library foundation (one-time)

on:
  push:
    branches: [feature/wintoys-manager-ui]

permissions:
  contents: write

jobs:
  rebase:
    if: github.ref_name == 'feature/wintoys-manager-ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest library foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/library-foundation
          git merge --no-edit -X ours origin/feature/library-foundation
      - name: Confirm merged branch and push
        run: git push origin "HEAD:${{ github.ref_name }}"
