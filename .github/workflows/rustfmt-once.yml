name: Format Rust library sources (one-time migration helper)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/library-foundation'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Format the Rust workspace
        run: cargo fmt --all
      - name: Commit formatting changes
        shell: pwsh
        run: |
          if (git diff --quiet) {
            Write-Host "Rust sources are already formatted."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/library
          git commit -m "style: format shared Rust libraries"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
