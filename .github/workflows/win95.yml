
name: Windows 95 application build

on:
  push:
    branches: [main, github/workflow]
    paths:
      - "C/win95/**"
      - "C/library/**"
      - "build.py"
      - ".github/workflows/win95.yml"
  pull_request:
    branches: [main, feature/wintoys-manager-ui]
    paths:
      - "C/win95/**"
      - "C/library/**"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect Win95 source and build entry point
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.target.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - id: target
        run: python build.py status win95 --github-output

  explain:
    name: Explain legacy compiler runner requirement
    needs: detect
    if: needs.detect.outputs.available == 'true' && vars.WINLOOK_ENABLE_WIN95_RUNNER != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Report required runner and toolchain
        run: |
          echo "C/win95/Makefile exists, but the dedicated Open Watcom runner is not enabled."
          echo "Register a self-hosted Linux x64 runner with the open-watcom label."
          echo "Install the verified Open Watcom 2.0 compiler and set WATCOM on that runner."
          echo "Then set the repository variable WINLOOK_ENABLE_WIN95_RUNNER=true."

  build:
    name: Build Win95 C application with Open Watcom
    needs: detect
    if: needs.detect.outputs.available == 'true' && vars.WINLOOK_ENABLE_WIN95_RUNNER == 'true'
    runs-on: [self-hosted, linux, x64, open-watcom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify Open Watcom compiler environment
        shell: bash
        run: |
          test -n "$WATCOM"
          command -v wcc386
          command -v wmake
          test -f "$WATCOM/binl64/wcc386" -o -f "$WATCOM/binnt/wcc386"
          echo "Open Watcom root and compiler tools are present."
      - name: Build Win95 target
        run: python build.py build win95
      - name: Upload Win95 build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winlook-win95
          path: build/c/win95/**
          if-no-files-found: error
          retention-days: 14
