name: Repeated build stress test

on:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "C/library/**"
      - "tests/**"
      - ".github/workflows/build-stress.yml"
  pull_request:
    branches: [main]
    paths:
      - "build.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "C/library/**"
      - "tests/**"
      - ".github/workflows/build-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-libraries:
    name: Rust and C libraries / repeated sanitizer verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Select Rust 1.95.0
        run: python build.py setup --with-rust --apply
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/.rcache
            build/.Ccache
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-build-stress-libraries-${{ hashFiles('Cargo.lock', 'rust/**/Cargo.toml', 'C/library/**') }}
          restore-keys: |
            ${{ runner.os }}-build-stress-libraries-
      - name: Pass 1 / full Rust and C sanitizer verification
        run: python build.py verify libraries --sanitizers
      - name: Remove generated outputs while preserving compiler caches
        run: python build.py clean --yes
      - name: Pass 2 / repeat after clean
        run: python build.py verify libraries --sanitizers

  windows-applications:
    name: ${{ matrix.target }} / repeated native build and package
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [win10, win11]
    env:
      WINLOOK_STRESS_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Initialize the installed Visual Studio MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe is missing: $vswhere"
          }

          $vsInstall = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            & $vswhere -all -products '*' -property installationPath
            throw "No Visual Studio instance with Microsoft.VisualStudio.Component.VC.Tools.x86.x64 was found."
          }

          $devCmd = Join-Path $vsInstall 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat is missing from the selected Visual Studio instance: $devCmd"
          }

          $command = 'call "' + $devCmd + '" -no_logo -arch=x64 -host_arch=x64 && set'
          $environmentLines = & $env:ComSpec /d /c $command 2>&1
          if ($LASTEXITCODE -ne 0) {
            $environmentLines | ForEach-Object { Write-Host $_ }
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE."
          }

          $values = @{}
          foreach ($line in $environmentLines) {
            $text = [string]$line
            $separator = $text.IndexOf('=')
            if ($separator -gt 0) {
              $values[$text.Substring(0, $separator)] = $text.Substring($separator + 1)
            }
          }

          $required = @('PATH', 'INCLUDE', 'LIB', 'WindowsSdkDir', 'WindowsSDKVersion', 'VCToolsInstallDir')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace($values[$name])) {
              throw "VsDevCmd.bat did not export the required environment variable: $name"
            }
          }

          $sdkRoot = $values['WindowsSdkDir'].TrimEnd([char]'\')
          $sdkVersion = $values['WindowsSDKVersion'].TrimEnd([char]'\')
          $sdkHeader = Join-Path $sdkRoot "Include\$sdkVersion\um\Windows.h"
          $sdkLibrary = Join-Path $sdkRoot "Lib\$sdkVersion\um\x64\kernel32.lib"
          if (-not (Test-Path $sdkHeader)) { throw "Windows SDK header is missing: $sdkHeader" }
          if (-not (Test-Path $sdkLibrary)) { throw "Windows SDK library is missing: $sdkLibrary" }

          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VCToolsInstallDir', 'VCToolsVersion', 'VCINSTALLDIR', 'VSINSTALLDIR', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_VER', 'VisualStudioVersion', 'DevEnvDir')) {
            if ($values.ContainsKey($name)) {
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$($values[$name])" -Encoding utf8
              Set-Item -Path "Env:$name" -Value $values[$name]
            }
          }

          foreach ($tool in @('cl.exe', 'link.exe', 'rc.exe')) {
            $resolved = & where.exe $tool | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($resolved)) {
              throw "The Visual Studio developer environment did not expose $tool on PATH."
            }
            Write-Host "$tool => $resolved"
          }
          Write-Host "Windows SDK => $sdkRoot ($sdkVersion)"
          Write-Host "Visual Studio => $vsInstall"
      - name: Select Rust 1.95.0
        run: python build.py setup --with-rust --apply
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build/.rcache
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-build-stress-${{ hashFiles('Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-build-stress-
      - name: Require the complete MSVC and Windows SDK toolchain
        run: python build.py doctor --strict
      - name: Verify WinUI Manager tests and Clippy
        run: python build.py verify ui
      - name: Pass 1 / clean build and package
        run: |
          python build.py clean --yes
          python build.py build ${{ matrix.target }}
          python build.py package ${{ matrix.target }}
          python -c "import os,pathlib,zipfile; t=os.environ['WINLOOK_STRESS_TARGET']; e=pathlib.Path('build/rust')/t/'release'/'winlook.exe'; a=pathlib.Path('build/artifacts')/f'winlook-{t}-x64-preview.zip'; assert e.is_file() and e.stat().st_size>0, f'Missing or empty {e}'; z=zipfile.ZipFile(a); assert z.testzip() is None; assert {'winlook.exe','RUNTIME-REQUIREMENTS.txt'}.issubset(z.namelist()); assert z.getinfo('winlook.exe').file_size>0; z.close(); print(f'Validated {a}')"
      - name: Pass 2 / incremental rebuild
        run: |
          python build.py build ${{ matrix.target }}
          python build.py package ${{ matrix.target }}
          python -c "import os,pathlib,zipfile; t=os.environ['WINLOOK_STRESS_TARGET']; e=pathlib.Path('build/rust')/t/'release'/'winlook.exe'; a=pathlib.Path('build/artifacts')/f'winlook-{t}-x64-preview.zip'; assert e.is_file() and e.stat().st_size>0, f'Missing or empty {e}'; z=zipfile.ZipFile(a); assert z.testzip() is None; assert {'winlook.exe','RUNTIME-REQUIREMENTS.txt'}.issubset(z.namelist()); assert z.getinfo('winlook.exe').file_size>0; z.close(); print(f'Validated {a}')"
      - name: Pass 3 / clean rebuild and final package
        run: |
          python build.py clean --yes
          python build.py build ${{ matrix.target }}
          python build.py package ${{ matrix.target }}
          python -c "import os,pathlib,zipfile; t=os.environ['WINLOOK_STRESS_TARGET']; e=pathlib.Path('build/rust')/t/'release'/'winlook.exe'; a=pathlib.Path('build/artifacts')/f'winlook-{t}-x64-preview.zip'; assert e.is_file() and e.stat().st_size>0, f'Missing or empty {e}'; z=zipfile.ZipFile(a); assert z.testzip() is None; assert {'winlook.exe','RUNTIME-REQUIREMENTS.txt'}.issubset(z.namelist()); assert z.getinfo('winlook.exe').file_size>0; z.close(); print(f'Validated {a}')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: winlook-${{ matrix.target }}-stress-package
          path: build/artifacts/winlook-${{ matrix.target }}-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
