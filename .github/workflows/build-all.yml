
name: Full WinLook build order

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "C/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.py"

permissions:
  contents: read

jobs:
  full:
    name: Libraries, UI, Win10 and Win11
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build/.rcache
            build/rust
            build/.Ccache
          key: ${{ runner.os }}-full-${{ hashFiles('Cargo.lock', 'rust/**/Cargo.toml', 'C/library/**') }}
          restore-keys: ${{ runner.os }}-full-
      - name: Report source availability and toolchain
        run: python build.py doctor
      - name: Run full supported build/verification sequence
        run: python build.py verify all
      - name: Upload application build outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winlook-full-build-outputs
          path: |
            build/rust/win10/release/**
            build/rust/win11/release/**
            build/c/**
          if-no-files-found: ignore
          retention-days: 7
