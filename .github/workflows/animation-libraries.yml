name: Animation libraries

on:
  push:
    branches: [main]
    paths:
      - "crates/wl_animate/**"
      - "legacy/wl_Lanimate/**"
      - ".github/workflows/animation-libraries.yml"
  pull_request:
    paths:
      - "crates/wl_animate/**"
      - "legacy/wl_Lanimate/**"
      - ".github/workflows/animation-libraries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-msvc:
    name: Rust library (Windows MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path crates/wl_animate/Cargo.toml -- --check
      - name: Run unit and documentation tests
        run: cargo test --manifest-path crates/wl_animate/Cargo.toml --all-targets --all-features
      - name: Run Clippy
        run: cargo clippy --manifest-path crates/wl_animate/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build API documentation
        run: cargo doc --manifest-path crates/wl_animate/Cargo.toml --no-deps

  c-msvc:
    name: C library (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure CMake
        run: cmake -S legacy/wl_Lanimate -B build/wl_Lanimate -A x64
      - name: Build static library and tests
        run: cmake --build build/wl_Lanimate --config Release
      - name: Run C tests
        run: ctest --test-dir build/wl_Lanimate -C Release --output-on-failure
